image: node:22-bookworm

stages:
  - validate
  - acceptance
  - deploy
  - backup

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  SANITY_PROJECT_ID: "o9d9rhdt"
  SANITY_DATASET: "production"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate:
  stage: validate
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm test
    - npm run build
    - cd sanity-studio
    - npm ci --cache ../.npm --prefer-offline
    - npx sanity build --yes

preview_acceptance:
  stage: acceptance
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - test -n "$PREVIEW_BASE_URL"
    - npm run test:preview

monthly_sanity_backup:
  stage: backup
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_BACKUP == "true"'
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - test -n "$SANITY_AUTH_TOKEN"
    - BACKUP_STORAGE=gitlab-artifact npm run backup:sanity
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - backups/*.tar.gz

monthly_neon_backup:
  stage: backup
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_BACKUP == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
  script:
    - test -n "$NEON_DATABASE_URL"
    - DATABASE_URL="$NEON_DATABASE_URL" BACKUP_STORAGE=gitlab-artifact npm run backup:neon
  after_script:
    - if [ "$CI_JOB_STATUS" != "success" ] && [ -n "$BACKUP_ALERT_WEBHOOK_URL" ]; then curl --fail --silent --show-error -X POST -H 'content-type: application/json' --data '{"text":"ZZGCopilot Neon backup failed in GitLab job '"$CI_JOB_ID"'"}' "$BACKUP_ALERT_WEBHOOK_URL"; fi
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - backups/*.tar.gz
