image: node:22-bookworm

stages:
  - validate
  - deploy
  - backup

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  SANITY_PROJECT_ID: "o9d9rhdt"
  SANITY_DATASET: "production"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate:
  stage: validate
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm test
    - npm run build
    - cd sanity-studio
    - npm ci --cache ../.npm --prefer-offline
    - npx sanity build --yes

deploy_sanity_studio:
  stage: deploy
  needs: ["validate"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
  before_script:
    - cd sanity-studio
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npx sanity deploy --yes

monthly_sanity_backup:
  stage: backup
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_BACKUP == "true"'
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - test -n "$SANITY_AUTH_TOKEN"
    - test -n "$BLOB_READ_WRITE_TOKEN"
    - npm run backup:sanity
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - backups/*.tar.gz
